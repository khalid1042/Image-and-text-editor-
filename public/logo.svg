<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Orange glowing line -->
  <rect x="61" y="5" width="8" height="25" rx="2" fill="#FF8C00" filter="url(#glow)" />
  
  <!-- Blue rounded square -->
  <rect x="10" y="15" width="80" height="80" rx="16" fill="#203a70" />
  
  <!-- White < shape -->
  <path d="M 45 40 L 25 55 L 45 70" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- White vertical line -->
  <line x1="65" y1="40" x2="65" y2="70" stroke="white" stroke-width="8" stroke-linecap="round" />
</svg>
